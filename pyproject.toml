[project]
name = "clarion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cython>=3.2.4",
    "datasets>=4.8.5",
    "logging>=0.4.9.6",
    "numpy>=2.4.4",
    "py-spy>=0.4.2",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "transformers>=5.8.1",
]

# Package layout: `src/` is itself a Python package (it has `src/__init__.py`),
# so imports use the form `from src.parallel import X`. We intentionally do NOT
# set `package-dir = {"" = "src"}` here — that would tell setuptools to strip
# the `src/` prefix and look for packages like `parallel` at the top level,
# which conflicts with how the code actually imports things. Leaving this
# section out lets setuptools auto-discover `src` as a top-level package and
# `src.parallel`, `src.models`, `src.index`, ... as sub-packages.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[dependency-groups]
dev = [
    "pylint>=4.0.5",
    "ruff>=0.15.13",
]
